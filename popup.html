<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Live Helper</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: #2a2a3d;
      --accent: #ff3d6b;
      --accent2: #7c3aed;
      --text: #f0f0f8;
      --text-muted: #6b6b8a;
      --text-dim: #b8b8d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }

    .app-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 11px 18px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .app-version {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }

    .section {
      padding: 16px 18px;
    }
    .section + .section { border-top: 1px solid var(--border); }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-row + .toggle-row { margin-top: 14px; }
    .toggle-label { font-size: 12px; color: var(--text-dim); }
    .toggle {
      width: 36px; height: 20px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--accent); border-color: var(--accent); }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(16px); }

    /* 「画質を自動設定」に従属する行。親トグルがOFFのときはまとめて無効化する */
    .sub-rows { margin-top: 14px; }
    .sub-rows.disabled { opacity: 0.35; pointer-events: none; }
    .sub-rows .toggle-row + .toggle-row { margin-top: 14px; }
    .select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 14px;
    }
    .select-row select {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 6px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }
    .select-row select:disabled { opacity: 0.4; cursor: not-allowed; }

    .toast {
      position: fixed;
      top: 7px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="app-header">YouTube Live Helper<span class="app-version" id="appVersion"></span></div>

<div class="section">
  <div class="section-title">ライブ配信</div>
  <div class="toggle-row">
    <span class="toggle-label">常に最新位置から再生</span>
    <div class="toggle on" id="jumpToLiveToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">チャットを常に全表示</span>
    <div class="toggle on" id="allChatToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">固定メッセージを自動で非表示</span>
    <div class="toggle on" id="hidePinnedToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">アンケートを自動で非表示</span>
    <div class="toggle on" id="hidePollsToggle"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">サイドバー（登録チャンネル）</div>
  <div class="toggle-row">
    <span class="toggle-label">ライブ中のチャンネルを上に表示</span>
    <div class="toggle on" id="sortLiveChannelsToggle"></div>
  </div>
  <div class="toggle-row">
    <span class="toggle-label">登録チャンネルを常に展開</span>
    <div class="toggle on" id="expandSubscriptionsToggle"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">画質（通常動画・Shorts含む）</div>
  <div class="toggle-row">
    <span class="toggle-label">画質を自動設定</span>
    <div class="toggle on" id="autoQualityToggle"></div>
  </div>
  <div class="sub-rows" id="qualityFields">
    <div class="toggle-row">
      <span class="toggle-label">常に最高画質を使う</span>
      <div class="toggle" id="useMaxQualityToggle"></div>
    </div>
    <div class="select-row">
      <span class="toggle-label">デフォルト画質</span>
      <select id="defaultQuality">
        <option value="highres">4320p (8K)</option>
        <option value="hd2160">2160p (4K)</option>
        <option value="hd1440">1440p (2K)</option>
        <option value="hd1080">1080p</option>
        <option value="hd720">720p</option>
        <option value="large">480p</option>
        <option value="medium">360p</option>
        <option value="small">240p</option>
        <option value="tiny">144p</option>
      </select>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
